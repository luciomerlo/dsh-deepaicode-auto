# Loader patch layer contributed by this bundle.
# Every value below is an ordinary plugin Config: override any key from the
# profile's own cordis.patch.yml (a matching row id replaces the whole config).
- insert:
    - id: llm-deepaicode
      name: dsh-deepaicode-auto
      config:
        baseUrl: https://api.deepai.org
        lane: 7
        dailyTheosBudget: 250
        autoModelId: auto
        autoModelName: Auto (DeepAiCode)
        maxFailovers: 8
        refreshCatalogOnError: true
        requestTimeoutMs: 180000
        # A stream that stops producing frames for this long is cancelled and
        # treated as a transport failure, so a stalled connection fails over
        # instead of hanging the turn.
        streamIdleTimeoutMs: 90000
        # Frontier tier: ordered highest reasoning capability first. The router
        # only spends daily Theos on models whose typical cost still fits in the
        # remaining allowance.
        frontier:
          - id: gpt-6-astra
            theos: 50
            label: GPT-6 Astra
          - id: claude-fable-5-2
            theos: 20
            label: Claude Fable 5.2
          - id: claude-opus-5-5
            theos: 15
            label: Claude Opus 5.5
          - id: muse-wonder
            theos: 15
            label: Muse Wonder
          - id: qwen-3.8-max-prime
            theos: 15
            label: Qwen 3.8 Max Prime
          - id: gpt-6.1-sol
            theos: 10
            label: GPT-6.1 Sol
          - id: claude-sonnet-5-5
            theos: 10
            label: Claude Sonnet 5.5
          - id: gemini-4-argon
            theos: 10
            label: Gemini 4 Argon
          - id: gemini-4-carbon
            theos: 10
            label: Gemini 4 Carbon
          - id: gemini-4-hydrogen
            theos: 8
            label: Gemini 4 Hydrogen
          - id: muse-spark-1.3
            theos: 6
            label: Muse Spark 1.3
          - id: gpt-6.1-terra
            theos: 5
            label: GPT-6.1 Terra
          - id: kimi-k3.1-pro
            theos: 3
            label: Kimi K3.1 Pro
          - id: kimi-k3
            theos: 3
            label: Kimi K3
          - id: glm-5.3
            theos: 3
            label: GLM 5.3
          - id: minimax-m3
            theos: 2
            label: MiniMax M3
        # Unmetered tier: 0 Theos per request, unlimited on a free account.
        unmetered:
          - deepseek-v4.1-flash
          - glm-5.3-flash
          - qwen-3.8-flash
          - mimo-2.6-pro
          - mimo-2.6-flash
          - minimax-m3.1-flash
          - gpt-6-luna
          - muse-ember
          - solar-mini-4
          - glyph-cluster
          - deepai-cyber
